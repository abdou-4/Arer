name: CI

on:
  push:
    branches: [main]
  pull_request:

# Why this matrix exists:
# CPython's June 2025 html.parser hardening (HTML5 CDATA conformance, following
# CVE-2025-6069) made HTMLParser treat the content of noframes/iframe/noembed/
# xmp as raw text, which broke Arer's tag-salad detection and 2 tests on every
# interpreter from ~3.13.6 / 3.12.11 onward. The detection fix lives in
# src/arer/util/html.py (_Reader.set_cdata_mode override, commit b4b01bd) and
# the suite now passes identically on pre- and post-hardening parsers.
# Note: uv's standalone Python builds carry the hardening backport even for old
# patch releases, so CI runs official CPython builds via setup-python, and uv
# only syncs dependencies against that exact interpreter.
# - Job "3.13.5": pinned official build, kept as the stable reference.
# - Job "3.13 (latest)": full suite, no exclusions. Since commit b4b01bd
#   (fix(html): keep detection stable across the CVE-2025-6069 html.parser
#   hardening) the suite passes identically on pre- and post-hardening
#   parsers, so no deselect/sentinel machinery is needed anymore.
# TODO: none pending for the parser - re-open this only if CPython changes
# html.parser behavior again in a way the suite does not cover.

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13.5"
            os: ubuntu-24.04        # 3.13.5 has no build for ubuntu-latest (26.04)
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up official CPython ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        # astral-sh/setup-uv v10.3.3, pinned by SHA. NOTE: this action does not
        # publish floating major tags (v10 does not exist), only vX.Y.Z tags.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Verify the selected interpreter
        run: |-
          v="$(python3.13 -V)"
          echo "interpreter: $v"
          want="${{ matrix.python-version }}"
          got="${v#Python }"
          case "$want" in
            *.*.*)
              # Exact pin (e.g. 3.13.5): the suite is only verified green on
              # this build, so require a byte-for-byte match.
              if [ "$got" != "$want" ]; then
                echo "::error::expected exactly $want; got $got"
                exit 1
              fi
              ;;
            *)
              # Floating spec (e.g. 3.13): setup-python resolves it to the
              # newest available patch build, so only require major.minor.
              if [ "${got%.*}" != "$want" ]; then
                echo "::error::expected $want.x; got $got"
                exit 1
              fi
              ;;
          esac

      - name: Sync dependencies against the selected interpreter
        run: uv sync --frozen --python "$(command -v python3.13)"

      - name: Run tests
        run: uv run pytest -q
